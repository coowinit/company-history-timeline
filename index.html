<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="响应式企业发展历程时间轴示例页面">
  <title>企业发展历程 | Responsive Timeline</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="assets/css/swiper-bundle.min.css">
  <link rel="stylesheet" href="assets/css/history-timeline.css">
</head>
<body>
  <main>
    <section class="history-section" aria-label="企业发展历程">
      <div class="history-wrap">
        <div class="swiper history-swiper" aria-label="企业发展历程轮播">
          <div class="swiper-wrapper" id="history-list">
            <!-- History items are generated from the data below. -->
          </div>
        </div>

        <div class="history-pagination" aria-label="选择发展历程"></div>
      </div>
    </section>
  </main>

  <script src="assets/js/swiper-bundle.min.js"></script>
  <script src="assets/js/history-timeline.js"></script>
</body>
</html>
